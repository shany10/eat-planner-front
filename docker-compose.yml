services:
  frontend:
    build:
      context: .
      args:
        - USERNAME=${USERNAME:-shany}
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    ports:
      - "${FRONT_PORT:-3001}:3001"
    env_file:
      - ./.env
    environment:
      NODE_ENV: "development"
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    # depends_on:
    #   - backend

volumes:
  frontend_node_modules:
